[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sellest-mcp-skills"
version = "0.1.1"
description = "Small MCP server that shares Markdown-only skills, with read-only and admin endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastmcp==3.4.11", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
mcp-skills = "mcp_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_skills"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
