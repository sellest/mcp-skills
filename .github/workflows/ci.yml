name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && pytest -q
  image-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t skills-ci .
      - name: Smoke-test the container as it runs in production
        run: |
          docker volume create skills-ci-data
          docker run -d --name skills-ci --init --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 128m \
            -v skills-ci-data:/data/skills -p 127.0.0.1:16004:6004 skills-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:16004/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:16004/health
          test "$(docker exec skills-ci id -u)" = 10001
          docker exec skills-ci python - <<'EOF'
          import asyncio
          from fastmcp import Client

          SKILL = "---\nname: ci-demo\ndescription: CI smoke skill\n---\n# CI\n"

          async def main():
              async with Client("http://127.0.0.1:6004/rw/mcp") as admin:
                  done = await admin.call_tool(
                      "register_skill", {"name": "ci-demo", "files": {"SKILL.md": SKILL}}
                  )
                  assert done.data["version"] == 1, done.data
              async with Client("http://127.0.0.1:6004/ro/mcp") as reader:
                  names = {tool.name for tool in await reader.list_tools()}
                  assert names == {"list_skills", "get_skill"}, names
                  got = await reader.call_tool("get_skill", {"name": "ci-demo"})
                  assert got.data["text"] == SKILL

          asyncio.run(main())
          EOF
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' skills-ci | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logs skills-ci || true
